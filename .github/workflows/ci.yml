name: Host and installed SDK

on:
  # A pull request's branch runs once (as the pull request), and a release tag reruns nothing main already ran.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A newer push to the same pull request cancels its older run.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  host:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
        python: ['3.11', '3.14']
    defaults:
      run:
        shell: bash
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          python-version: ${{ matrix.python }}
      - name: Build Core's step runtime
        # Core's loader runs every engine on crit_core_steps: the host tests load the toy engine's plugin package on it.
        run: |
          cmake -S core -B build/core-steps -DCMAKE_BUILD_TYPE=Release
          cmake --build build/core-steps --config Release --target crit_core_steps --parallel 2
          library=$(find build/core-steps \( -name 'libcrit_core_steps.so' -o -name 'crit_core_steps.dll' \) | head -n 1)
          echo "CRIT_CORE_STEP_LIBRARY=$(python -c 'import pathlib, sys; print(pathlib.Path(sys.argv[1]).resolve())' "$library")" >> "$GITHUB_ENV"
      - name: Host contracts and chat processes
        # One process per test module, four at a time: most tests wait on served engines' processes.
        run: python -B tests/run_parallel.py --jobs 4
      - name: Build and install Python package from a disposable snapshot
        run: |
          python -m pip install setuptools==84.0.0 wheel==0.48.0
          mkdir -p build/package-source
          git archive HEAD | tar -x -C build/package-source
          python -B -c "import os; from setuptools.build_meta import build_sdist, build_wheel; os.chdir('build/package-source'); build_sdist('../dist'); build_wheel('../dist')"
          (cd build/package-source/core/python && python -B -c "from setuptools.build_meta import build_wheel; build_wheel('../../../dist')")
          python -m pip install --no-deps build/dist/*.whl
          cd build/ci-temp
          crit --version
          crit kernels
          # The plugin library ships in the wheel: the installed crit lists and checks its own copy.
          crit plugins list
          crit inference check
      - name: Verify source stayed unchanged
        run: git diff --exit-code

  native:
    # The native SDK, Inference and Kernels builds do not depend on the Python version: once per OS.
    name: ${{ matrix.os }} / native
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
        python: ['3.14']
    defaults:
      run:
        shell: bash
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          python-version: ${{ matrix.python }}
      - name: Build native host SDK
        run: |
          cmake -S core -B build/core -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build build/core --config Release --parallel 2
          ctest --test-dir build/core -C Release --output-on-failure
          cmake --install build/core --config Release --prefix "$PWD/build/core-install"
          cmp LICENSE build/core-install/share/licenses/crit/LICENSE
      - name: Build native host SDK with Clang
        # GCC -Wshadow misses a local that hides an anonymous-namespace variable; Clang -Wshadow reports it.
        if: runner.os == 'Linux'
        run: |
          cmake -S core -B build/core-clang -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=clang++
          cmake --build build/core-clang --config Release --parallel 2
          ctest --test-dir build/core-clang -C Release --output-on-failure
      - name: Build Inference native examples and fixtures against Core
        run: |
          cmake -S inference -B build/inference -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build build/inference --config Release --parallel 2
          ctest --test-dir build/inference -C Release --output-on-failure
      - name: Inference against the installed Core SDK
        run: |
          cmake -S inference -B build/inference-installed -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Release -DCRIT_INFERENCE_INSTALLED_CORE=ON -DCMAKE_PREFIX_PATH="$PWD/build/core-install"
          cmake --build build/inference-installed --config Release --parallel 2
          ctest --test-dir build/inference-installed -C Release --output-on-failure
      - name: Core and Inference walkthrough from checkout
        run: |
          cmake -S inference/examples/core-projection -B build/core-projection -DCMAKE_BUILD_TYPE=Release
          cmake --build build/core-projection --config Release --parallel 2
          ctest --test-dir build/core-projection -C Release --output-on-failure
      - name: Independent installed SDK consumers
        run: |
          cmake -S tests/core/concurrency_consumer -B build/consumer -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$PWD/build/core-install"
          cmake --build build/consumer --config Release --parallel 2
          ctest --test-dir build/consumer -C Release --output-on-failure
      - name: Native Kernels integration and retained dependency fixtures
        run: |
          cmake -S kernels/examples/openblas -B build/kernels -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Release -DPython3_EXECUTABLE="$(python -c 'import sys; print(sys.executable)')"
          cmake --build build/kernels --config Release --parallel 2
          ctest --test-dir build/kernels -C Release --output-on-failure
      - name: Verify source stayed unchanged
        run: git diff --exit-code
