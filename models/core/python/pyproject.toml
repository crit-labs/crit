[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

# crit Models' Python package on its own: a decoder's mechanisms and the rules over them, which crit and crit Eval
# (https://github.com/crit-labs/crit-eval) both read.
[project]
name = "crit-models"
version = "0.25.0"
description = "crit Models' Python side: a decoder's mechanisms from its config.json, the rules over them, and the harness of a model plugin's tests"
license = "Apache-2.0"
# A copy of the root LICENSE (CI compares them): license files must sit inside the project directory.
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["crit-core==0.25.0"]

[project.urls]
Repository = "https://github.com/crit-labs/crit"

[project.entry-points."crit_core.gguf_checks"]
crit_models = "crit_models.gguf:CHECKS"

[tool.setuptools.packages.find]
include = ["crit_models*"]

[tool.setuptools.package-data]
crit_models = ["config_keys.json"]
