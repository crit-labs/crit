name: Kernels for every architecture

# crit's kernels are tuned and run on one GPU; this workflow keeps every other GPU they claim honest at the level CI
# can reach without one: each CUDA kernel compiles for every compute capability in its kernel.json, and each
# architecture's register and shared-memory limits hold (crit kernels gates --limits-only, cuobjdump, no GPU). It does
# not run the kernels: a capability no GPU of its kind has run stays compile-checked (kernels/README.md#one-gpu).
on:
  push:
    branches: [main]
    paths: ['kernels/**', '.github/workflows/kernels.yml']
  pull_request:
    paths: ['kernels/**', '.github/workflows/kernels.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  list:
    name: CUDA kernels
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      kernels: ${{ steps.list.outputs.kernels }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: list
        # Every kernel.json with CUDA sources: language cuda, or a Triton kernel's "cuda" sources.
        run: |
          python3 - >> "$GITHUB_OUTPUT" <<'PY'
          import json, pathlib
          ids = sorted(m["id"] for m in (json.loads(p.read_text(encoding="utf-8"))
                                         for p in pathlib.Path("kernels").glob("**/kernel.json"))
                       if m.get("language") == "cuda" or m.get("cuda"))
          print("kernels=" + json.dumps(ids))
          PY

  build:
    name: ${{ matrix.kernel }} / every architecture
    needs: list
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        kernel: ${{ fromJSON(needs.list.outputs.kernels) }}
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: torch, the CUDA toolkit, ninja
        # PyPI's torch 2.14.1 for Linux, built with CUDA 13.0 (its runtime libraries come with it), and beside it in
        # its own folder the CUDA 13.1 toolkit's wheels (nvcc, the headers and libraries an extension links) and
        # cuobjdump (13.2, the oldest on PyPI; it reads 13.1's binaries). 13.1, not 13.0: 13.0's nvcc fails with an
        # internal error on pinned-gemm against Ubuntu 24.04's GCC 13 headers. The wheels name their libraries with the
        # major version only and keep them in lib/, so the linker's plain names are added beside them and lib64/
        # (where nvcc links its static runtime from) points at lib/.
        run: |
          python -m pip install torch==2.14.1 ninja==1.13.0
          python -m pip install --target "$RUNNER_TEMP/cuda" \
            "cuda-toolkit[nvcc,cudart,cccl,crt,cublas,cusparse,cusolver,curand,cufft]==13.1.2" nvidia-cuda-cuobjdump==13.2.86
          cuda="$RUNNER_TEMP/cuda/nvidia/cu13"
          (cd "$cuda/lib" && for f in *.so.[0-9]*; do plain="${f%%.so.*}.so"; [ -e "$plain" ] || ln -s "$f" "$plain"; done)
          [ -e "$cuda/lib64" ] || ln -s lib "$cuda/lib64"
          echo "CUDA_HOME=$cuda" >> "$GITHUB_ENV"
          echo "$cuda/bin" >> "$GITHUB_PATH"
          "$cuda/bin/nvcc" --version
      - name: crit, as documented
        run: python -m pip install -e core/python -e .
      - name: Build for every architecture and check its limits
        env:
          # torch's builder adds its own -gencode for these; the kernel's build names every architecture itself.
          TORCH_CUDA_ARCH_LIST: '8.0'
          MAX_JOBS: '4'
          CRIT_KERNEL_CACHE: ${{ runner.temp }}/kernels
        run: crit kernels gates "${{ matrix.kernel }}" --limits-only

  host:
    # The kernel library's host-side tests: tunings, tables and gates' bookkeeping, with no GPU.
    name: Kernel library host tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Install
        run: |
          python -m pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy==2.4.6 pytest==9.2.0 -e core/python -e .
      - name: crit_kernels' tests
        run: python -m pytest -q -p no:cacheprovider kernels/crit_kernels/tests
