<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 290" role="img" aria-label="Sampled decode and prefill of each Eval-measured candidate of the speed run over its 5h 28m of active development: decode rises from 166 to 199.5 tok/s, prefill from 6,015 to 7,552 tok/s">
