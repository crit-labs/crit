name: Release to PyPI

# A pushed vX.Y.Z tag builds crit X.Y.Z and crit-core X.Y.Z (core/python) and publishes both through PyPI trusted
# publishing (no token) once main's CI passed on the tagged commit. crit-eval releases from its own repository.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Tag and every version agree
        run: |
          python - <<'PY'
          import os, re
          tag = os.environ['GITHUB_REF_NAME'].removeprefix('v')
          version = re.search(r'^__version__ = "([^"]+)"', open('cli/crit/__init__.py', encoding='utf-8').read(), re.M)[1]
          if version != tag:
              raise SystemExit(f'tag {tag} differs from crit {version}')
          print(f'crit and crit-core {tag}')
          PY
          # Every package, build and doc that names the version names this one (tests/test_versions.py).
          cd tests && python -B -m unittest test_versions
      - name: Build sdists and wheels from a disposable snapshot
        run: |
          python -m pip install setuptools==84.0.0 wheel==0.48.0
          mkdir -p build/package-source
          git archive HEAD | tar -x -C build/package-source
          python -B -c "import os; from setuptools.build_meta import build_sdist, build_wheel; os.chdir('build/package-source'); build_sdist('../../dist'); build_wheel('../../dist')"
          python -B -c "import os; from setuptools.build_meta import build_sdist, build_wheel; os.chdir('build/package-source/core/python'); build_sdist('../../../../dist'); build_wheel('../../../../dist')"
          ls -l dist
      - name: Wheels install and run
        run: |
          python -m pip install tokenizers==0.23.3 jinja2==3.1.6
          python -m pip install --no-deps dist/*.whl
          cd "$RUNNER_TEMP"
          crit --version
          python -B -c "import crit_core; print(crit_core.__version__)"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  main-ci:
    name: Main's CI passed on this commit
    # PyPI gets only a commit main's CI ("Host and installed SDK", ci.yml) passed on: the tag must be on a commit main
    # ran, and this job waits while that run is going. After a failed run, rerun its failed jobs, then this one.
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Wait for main's CI run on the tagged commit
        run: |
          for attempt in $(seq 1 85); do
            run=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=main&event=push&head_sha=$GITHUB_SHA" \
                    --jq '.workflow_runs | max_by(.run_number) // empty | "\(.status) \(.conclusion) \(.html_url)"')
            if [ -z "$run" ]; then
              # main's run starts with the merge; a tag on a commit main never ran gets none.
              [ "$attempt" -ge 10 ] && { echo "::error::main's CI has no run on $GITHUB_SHA: tag a commit on main"; exit 1; }
            else
              read -r status conclusion url <<< "$run"
              echo "main's CI: $status $conclusion $url"
              if [ "$status" = completed ]; then
                [ "$conclusion" = success ] && exit 0
                echo "::error::main's CI $conclusion on $GITHUB_SHA ($url): rerun its failed jobs, then this job"
                exit 1
              fi
            fi
            sleep 60
          done
          echo "::error::main's CI did not finish within 85 minutes"
          exit 1

  publish:
    name: Publish to PyPI
    needs: [build, main-ci]
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/crit/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
