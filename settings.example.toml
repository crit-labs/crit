# Machine settings for crit run and crit eval. Copy this file to settings.toml (untracked) and edit it there;
# docs/RUN_RECORDS.md describes every key. Values shown are the defaults; commented keys have none.

# Folder for work that must run under WSL (an absolute path inside the distribution); unset: none.
# wsl_run_root = "/srv/crit/runs"

# A crit eval probe result (relative: from this folder); run create sizes the context on it.
# device = "device.json"

# Host memory left free at the engine's peak, in GiB.
ram_headroom_gib = 2

# Device memory left free at the engine's peak, in GiB.
vram_headroom_gib = 1

# Device memory kept out of the KV cache when Eval computes the max context, in GiB: activations,
# workspaces, graphs and speed techniques. A larger reserve trades context for that room.
context_reserve_gib = 3

# The context wanted: the longest request, prompt plus output, engines are built for. The model's
# positions and the device's free memory may allow less; the run record says which bound applied.
context_tokens = 200000

# The quality mode of new runs whose request names none: how much output drift from the checkpoint you select the
# engine may trade for speed, whatever format that checkpoint is stored in. Both modes judge against the same
# reference (the checkpoint's stored weights with exact activations). speed (the default):
# a budget that only keeps out a broken engine, so 4-bit or 8-bit activations, a lower-precision KV cache and the
# like are the engine's to use; preserve: a budget that keeps the output close to the checkpoint's.
# quality_mode = "speed"

# Where Eval fetches reference packages (a checkpoint's prepared data and reference scores): a folder
# or an https base URL. With one, crit eval run and crit run eval fetch them instead of scoring here.
# eval_packages = "https://huggingface.co/datasets/ORG/REPO/resolve/main"
