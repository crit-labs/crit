name: crit job setup
description: >-
  What every CI job of crit starts with after its checkout: Python, a canonical temporary directory, the pinned
  runtime dependencies and crit Eval beside the checkout.
inputs:
  python-version:
    description: The Python version the job runs on
    required: true
runs:
  using: composite
  steps:
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ inputs.python-version }}
    - name: Use a canonical temporary directory
      shell: bash
      run: |
        python - <<'PY'
        import os
        from pathlib import Path
        temporary = (Path(os.environ['GITHUB_WORKSPACE']).resolve() / 'build' / 'ci-temp')
        temporary.mkdir(parents=True, exist_ok=True)
        temporary = temporary.resolve()
        with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as environment:
            for name in ('TMP', 'TEMP', 'TMPDIR'):
                environment.write(f'{name}={temporary}\n')
        print(f'Temporary fixtures: {temporary}')
        PY
    - name: Install pinned runtime dependencies
      shell: bash
      run: python -m pip install tokenizers==0.23.3 jinja2==3.1.6
    - name: Install torch for the CPU
      # Every plugin that computes on a device speaks its slot's device form in torch, the CPU included: the toy engine
      # the host tests and Core's concurrency check load runs on torch's CPU tensors.
      shell: bash
      run: python -m pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
    - name: Install numpy
      # torch's CPU wheel does not require numpy, but crit reads host tensors through it: the prompt batches' pinned
      # staging (crit_plugins.device), lookup-table-rows, the expert stores and Core's torch-file reader. 2.4.6 is the
      # newest numpy with wheels for every Python CI runs (3.11 to 3.14; 2.5 requires 3.12).
      shell: bash
      run: python -m pip install numpy==2.4.6
    - name: Install transformers
      # The supported range is pyproject's reference extra (transformers>=5.20,<6); the routing and reference
      # fixtures compare crit with it and skip without it, so CI runs them on one version of the range.
      shell: bash
      run: python -m pip install transformers==5.20.2
    - name: Install crit Eval from its repository
      # crit eval and crit run's Eval steps import crit_eval, and crit's tests reuse its fixtures (tests/) beside this checkout.
      shell: bash
      run: git clone --depth 1 https://github.com/crit-labs/crit-eval ../crit-eval && python -m pip install --no-deps -e ../crit-eval
