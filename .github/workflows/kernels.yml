name: Kernels for every architecture

# crit's kernels are tuned and run on one GPU; this workflow keeps every other GPU they claim honest at the level CI
# can reach without one: each CUDA kernel compiles for every compute capability in its kernel.json, and each
# architecture's register and shared-memory limits hold (crit kernels gates --limits-only, cuobjdump, no GPU). It does
# not run the kernels: a capability no GPU of its kind has run stays compile-checked (kernels/README.md#one-gpu).
on:
  push:
    branches: [main]
    paths: ['kernels/**', 'inference/techniques/*/*/operations.json', 'inference/techniques/*/*/code/*.cu', 'inference/techniques/*/*/code/*.cuh',
            'inference/techniques/*/*/code/*.h', 'inference/core/python/crit_plugins/host/*.cu', 'inference/core/python/crit_plugins/host/*.cuh',
            'inference/core/python/crit_plugins/host/*.h', '.github/workflows/kernels.yml']
  pull_request:
    paths: ['kernels/**', 'inference/techniques/*/*/operations.json', 'inference/techniques/*/*/code/*.cu', 'inference/techniques/*/*/code/*.cuh',
            'inference/techniques/*/*/code/*.h', 'inference/core/python/crit_plugins/host/*.cu', 'inference/core/python/crit_plugins/host/*.cuh',
            'inference/core/python/crit_plugins/host/*.h', '.github/workflows/kernels.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  list:
    name: CUDA kernels
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      kernels: ${{ steps.list.outputs.kernels }}
      matrix: ${{ steps.list.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # A pull request compares its head with its base.
          fetch-depth: ${{ github.event_name == 'pull_request' && '0' || '1' }}
      - id: list
        # Every kernel.json with CUDA sources: language cuda, or a Triton kernel's "cuda" sources. A pull request builds
        # only the kernels whose folders it changes, and every kernel when it changes anything else of kernels/ they may
        # share (kernels/core, crit_kernels) or this workflow; Markdown outside a kernel's folder builds none.
        # Each kernel comes with a key over everything its build and gates read: its own folder, the kernel core and
        # crit_kernels, Core's Python packages (the builder, the cache, the checkpoint readers), crit's record reader,
        # the operations and CUDA sources of the techniques, and this workflow (the toolchain's versions). A build
        # job whose key passed before does not build again (the build job's cache).
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          python3 - >> "$GITHUB_OUTPUT" <<'PY'
          import hashlib, json, os, pathlib, subprocess
          manifests = {p: json.loads(p.read_text(encoding="utf-8"))
                       for p in pathlib.Path("kernels").glob("**/kernel.json")}
          kernels = {p.parent.as_posix() + "/": m["id"] for p, m in manifests.items()
                     if m.get("language") == "cuda" or m.get("cuda")}
          chosen = set(kernels.values())
          if os.environ["BASE"]:
              changed = subprocess.run(["git", "diff", "--name-only", "--no-renames", os.environ["BASE"] + "...HEAD"],
                                       check=True, stdout=subprocess.PIPE, text=True).stdout.split()
              owners = [[kernel for folder, kernel in kernels.items() if path.startswith(folder)] for path in changed]
              # Outside kernels/ only this workflow decides what builds (the workflow runs on nothing else).
              if all(owner or path.endswith(".md") or not path.startswith(("kernels/", ".github/workflows/kernels.yml"))
                     for path, owner in zip(changed, owners)):
                  chosen = {kernel for owner in owners for kernel in owner}
          print("kernels=" + json.dumps(sorted(chosen)))
          shared = ["kernels/core", "kernels/crit_kernels", "inference/core/python", "cli/crit/records.py",
                    ":(glob)inference/techniques/*/*/operations.json", ":(glob)models/techniques/*/*/operations.json",
                    ":(glob)inference/techniques/*/*/code/*.cu", ":(glob)inference/techniques/*/*/code/*.cuh",
                    ":(glob)inference/techniques/*/*/code/*.h", ".github/workflows/kernels.yml"]
          def key(folder):
              # git's blob hashes of the files: the same content gives the same key on every checkout
              listed = subprocess.run(["git", "ls-files", "-s", "--", folder, *shared], check=True,
                                      stdout=subprocess.PIPE).stdout
              return hashlib.sha256(listed).hexdigest()
          folders = {kernel: folder for folder, kernel in kernels.items()}
          print("matrix=" + json.dumps({"include": [{"kernel": kernel, "key": key(folders[kernel])}
                                                    for kernel in sorted(chosen)]}))
          PY
          cat "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.kernel }} / every architecture
    needs: list
    if: needs.list.outputs.kernels != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      # {include: [{kernel, key}]}: the kernels to build, each with the key of what its build reads (the list job)
      matrix: ${{ fromJSON(needs.list.outputs.matrix) }}
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
    steps:
      - id: image
        # The runner image brings the host compiler nvcc calls: a new image builds again.
        run: echo "version=$ImageVersion" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        # A note that this kernel's build and gates passed for this key, kept only when the job succeeds: with it the
        # job has nothing to do (decode-gemv alone builds for 11 minutes). A key holds everything the build reads, so
        # a change to any of it builds again, and a failed job keeps no note.
        id: passed
        with:
          path: kernel-gates-passed.txt
          key: kernel-gates-${{ matrix.kernel }}-${{ steps.image.outputs.version }}-${{ matrix.key }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.passed.outputs.cache-hit != 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: steps.passed.outputs.cache-hit != 'true'
        with:
          python-version: '3.14'
      - name: torch, the CUDA toolkit, ninja
        if: steps.passed.outputs.cache-hit != 'true'
        # PyPI's torch 2.14.1 for Linux, built with CUDA 13.0 (its runtime libraries come with it), and beside it in
        # its own folder the CUDA 13.1 toolkit's wheels (nvcc, the headers and libraries an extension links) and
        # cuobjdump (13.2, the oldest on PyPI; it reads 13.1's binaries). 13.1, not 13.0: 13.0's nvcc fails with an
        # internal error on pinned-gemm against Ubuntu 24.04's GCC 13 headers. The wheels name their libraries with the
        # major version only and keep them in lib/, so the linker's plain names are added beside them and lib64/
        # (where nvcc links its static runtime from) points at lib/. uv installs them: pip took about a minute and
        # a half.
        run: |
          python -m pip install --disable-pip-version-check uv==0.13.8
          python -m uv pip install --system torch==2.14.1 ninja==1.13.0
          python -m uv pip install --target "$RUNNER_TEMP/cuda" \
            "cuda-toolkit[nvcc,cudart,cccl,crt,cublas,cusparse,cusolver,curand,cufft]==13.1.2" nvidia-cuda-cuobjdump==13.2.86
          cuda="$RUNNER_TEMP/cuda/nvidia/cu13"
          (cd "$cuda/lib" && for f in *.so.[0-9]*; do plain="${f%%.so.*}.so"; [ -e "$plain" ] || ln -s "$f" "$plain"; done)
          [ -e "$cuda/lib64" ] || ln -s lib "$cuda/lib64"
          echo "CUDA_HOME=$cuda" >> "$GITHUB_ENV"
          echo "$cuda/bin" >> "$GITHUB_PATH"
          "$cuda/bin/nvcc" --version
      - name: crit, as documented
        if: steps.passed.outputs.cache-hit != 'true'
        run: python -m pip install -e inference/core/python -e models/core/python -e .
      - name: Build for every architecture and check its limits
        if: steps.passed.outputs.cache-hit != 'true'
        env:
          # torch's builder adds its own -gencode for these; the kernel's build names every architecture itself.
          TORCH_CUDA_ARCH_LIST: '8.0'
          MAX_JOBS: '4'
          CRIT_KERNEL_CACHE: ${{ runner.temp }}/kernels
        run: |
          crit kernels gates "${{ matrix.kernel }}" --limits-only
          echo "${{ matrix.kernel }} ${{ matrix.key }}" > kernel-gates-passed.txt

  outside:
    # The CUDA crit builds outside kernels/ (Core's
    # host handoff: built by crit_plugins.native at load) for every architecture the kernels claim, within the
    # register and spill limits (python -m crit_kernels.outside), with no GPU.
    name: CUDA outside kernels/ / every architecture
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: torch, the CUDA toolkit, ninja
        # PyPI's torch 2.14.1 for Linux, built with CUDA 13.0 (its runtime libraries come with it), and beside it in
        # its own folder the CUDA 13.1 toolkit's wheels (nvcc, the headers and libraries an extension links) and
        # cuobjdump (13.2, the oldest on PyPI; it reads 13.1's binaries). 13.1, not 13.0: 13.0's nvcc fails with an
        # internal error on pinned-gemm against Ubuntu 24.04's GCC 13 headers. The wheels name their libraries with the
        # major version only and keep them in lib/, so the linker's plain names are added beside them and lib64/
        # (where nvcc links its static runtime from) points at lib/. uv installs them: pip took about a minute and
        # a half.
        run: |
          python -m pip install --disable-pip-version-check uv==0.13.8
          python -m uv pip install --system torch==2.14.1 ninja==1.13.0
          python -m uv pip install --target "$RUNNER_TEMP/cuda" \
            "cuda-toolkit[nvcc,cudart,cccl,crt,cublas,cusparse,cusolver,curand,cufft]==13.1.2" nvidia-cuda-cuobjdump==13.2.86
          cuda="$RUNNER_TEMP/cuda/nvidia/cu13"
          (cd "$cuda/lib" && for f in *.so.[0-9]*; do plain="${f%%.so.*}.so"; [ -e "$plain" ] || ln -s "$f" "$plain"; done)
          [ -e "$cuda/lib64" ] || ln -s lib "$cuda/lib64"
          echo "CUDA_HOME=$cuda" >> "$GITHUB_ENV"
          echo "$cuda/bin" >> "$GITHUB_PATH"
          "$cuda/bin/nvcc" --version
      - name: crit, as documented
        run: python -m pip install -e inference/core/python -e models/core/python -e .
      - name: Compile for every architecture and check its limits
        run: python -m crit_kernels.outside

  host:
    # The kernel library's host-side tests: tunings, tables and gates' bookkeeping, with no GPU.
    name: Kernel library host tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Install
        run: |
          python -m pip install --disable-pip-version-check uv==0.13.8
          python -m uv pip install --system torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
          python -m uv pip install --system numpy==2.4.6 pytest==9.2.0 -e inference/core/python -e models/core/python -e .
      - name: crit_kernels' tests
        run: python -m pytest -q -p no:cacheprovider kernels/crit_kernels/tests
