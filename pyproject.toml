[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "crit"
version = "0.2.0"
description = "crit: inference runtime, reusable techniques, kernel discovery, evaluation and an OpenAI-compatible serving API"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["tokenizers>=0.22,<0.24", "jinja2>=3.1.4,<4"]

[project.urls]
Repository = "https://github.com/crit-labs/crit"

[project.scripts]
crit = "crit.cli:main"

[tool.setuptools.packages.find]
where = ["cli", "api", "eval", "kernels", "models", "core/python"]
include = ["crit*", "crit_api*", "crit_eval*", "crit_kernels*", "crit_models*", "crit_core*"]
