name: Release to PyPI

# A pushed vX.Y.Z tag builds crit X.Y.Z and crit-core X.Y.Z (core/python) and publishes both through PyPI trusted
# publishing (no token). crit-eval releases from its own repository.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Tag and every package version agree
        run: |
          python - <<'PY'
          import os, re, tomllib
          tag = os.environ['GITHUB_REF_NAME'].removeprefix('v')
          found = {}
          for project in ('pyproject.toml', 'core/python/pyproject.toml'):
              with open(project, 'rb') as f:
                  found[project] = tomllib.load(f)['project']['version']
          for module in ('cli/crit/__init__.py', 'core/python/crit_core/__init__.py'):
              found[module] = re.search(r'^__version__ = "([^"]+)"', open(module, encoding='utf-8').read(), re.M)[1]
          if set(found.values()) != {tag}:
              raise SystemExit(f'tag {tag} differs from {found}')
          print(f'crit and crit-core {tag}')
          PY
      - name: Build sdists and wheels from a disposable snapshot
        run: |
          python -m pip install setuptools==84.0.0 wheel==0.48.0
          mkdir -p build/package-source
          git archive HEAD | tar -x -C build/package-source
          python -B -c "import os; from setuptools.build_meta import build_sdist, build_wheel; os.chdir('build/package-source'); build_sdist('../../dist'); build_wheel('../../dist')"
          python -B -c "import os; from setuptools.build_meta import build_sdist, build_wheel; os.chdir('build/package-source/core/python'); build_sdist('../../../../dist'); build_wheel('../../../../dist')"
          ls -l dist
      - name: Wheels install and run
        run: |
          python -m pip install tokenizers==0.23.3 jinja2==3.1.6
          python -m pip install --no-deps dist/*.whl
          cd "$RUNNER_TEMP"
          crit --version
          python -B -c "import crit_core; print(crit_core.__version__)"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/crit/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
